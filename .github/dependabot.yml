version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 30
      semver-major-days: 90
      semver-minor-days: 30
      semver-patch-days: 30

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
